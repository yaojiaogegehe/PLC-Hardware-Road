; ESP32-CAM 四驱 FPV 小车 · PlatformIO 配置
; 板型：AI Thinker ESP32-CAM（board id: esp32cam）
; 注意：platform 锁定 6.7.0 = Arduino 内核 2.0.x（ledc 旧版 API，固件按此编写，勿升 3.x 内核）

[env:esp32cam]
platform = espressif32@6.7.0
board = esp32cam
framework = arduino
board_build.partitions = min_spiffs.csv
upload_speed = 921600
monitor_speed = 115200
